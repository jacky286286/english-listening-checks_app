<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多益聽力極簡檢討庫</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #2563eb;
            --primary-bg: #eff6ff;
            --badge-a: #dc2626;
            --badge-b: #d97706;
            --badge-c: #4f46e5;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 12px;
            display: flex;
            justify-content: center;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 1240px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .btn-export {
            padding: 8px 14px;
            background: #0f172a;
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .btn-export:hover {
            background: #334155;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @media (min-width: 900px) {
            body {
                padding: 24px;
            }
            .main-layout {
                display: grid;
                grid-template-columns: 380px 1fr;
                gap: 24px;
                align-items: start;
            }
            .left-panel {
                position: sticky;
                top: 20px;
            }
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .char-counter {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-select {
            flex: 1;
            min-width: 60px;
            min-height: 38px;
            padding: 6px 10px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: var(--radius);
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.15s ease;
        }

        .btn-select.active {
            border-color: var(--primary);
            background: var(--primary-bg);
            color: var(--primary);
            font-weight: 700;
        }

        .btn-select.active[data-val="A"] { border-color: var(--badge-a); color: var(--badge-a); background: #fef2f2; }
        .btn-select.active[data-val="B"] { border-color: var(--badge-b); color: var(--badge-b); background: #fffbeb; }
        .btn-select.active[data-val="C"] { border-color: var(--badge-c); color: var(--badge-c); background: #eef2ff; }

        input[type="text"], input[type="date"] {
            width: 100%;
            min-height: 40px;
            padding: 8px 12px;
            font-size: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            background: #fff;
            color: var(--text-main);
        }

        @media (min-width: 900px) {
            input[type="text"], input[type="date"] {
                font-size: 0.9rem;
                min-height: 36px;
            }
        }

        input[type="text"]:focus, input[type="date"]:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            min-height: 42px;
            padding: 10px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }

        .btn-submit:hover {
            opacity: 0.92;
        }

        /* 篩選工具列 */
        .filter-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .date-range-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .date-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            align-items: center;
        }

        .date-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .date-field span {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .date-actions {
            display: flex;
            justify-content: flex-end;
        }

        .btn-clear-date {
            padding: 6px 12px;
            font-size: 0.75rem;
            border: 1px solid var(--border);
            background: var(--bg);
            border-radius: var(--radius);
            cursor: pointer;
            color: var(--text-muted);
        }

        .filter-tags-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-tag {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-muted);
        }

        .filter-tag.active {
            background: var(--text-main);
            color: #fff;
            border-color: var(--text-main);
            font-weight: 600;
        }

        /* 記錄卡片排版與錨定 */
        .log-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        /* 頂部固定錨定行：標籤置左、時間與刪除按鈕置右 */
        .log-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .log-badges {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .badge-a { background: #fef2f2; color: var(--badge-a); }
        .badge-b { background: #fffbeb; color: var(--badge-b); }
        .badge-c { background: #eef2ff; color: var(--badge-c); }
        .badge-part { background: #f1f5f9; color: var(--text-muted); }

        .log-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .time-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .btn-del {
            border: none;
            background: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 2px 4px;
        }

        .btn-del:hover {
            color: #ef4444;
        }

        /* 題號情境列：獨立佔行，支援展開 */
        .log-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            word-break: break-word;
            cursor: pointer;
        }

        .log-title.clamped {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 阻礙點與修正內容排版 */
        .log-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        @media (min-width: 600px) {
            .log-content {
                grid-template-columns: 1fr 1fr;
            }
        }

        .content-box {
            padding: 8px 10px;
            background: var(--bg);
            border-radius: 4px;
            font-size: 0.88rem;
            word-break: break-word;
            cursor: pointer;
            transition: background 0.15s ease;
            position: relative;
        }

        .content-box:hover {
            background: #f1f5f9;
        }

        .content-box strong {
            display: block;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            pointer-events: none;
        }

        .box-text.clamped {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .expand-hint {
            display: block;
            font-size: 0.7rem;
            color: var(--primary);
            margin-top: 4px;
            font-weight: 500;
            user-select: none;
        }

        .empty-hint {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 36px 0;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px dashed var(--border);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>多益聽力極簡檢討庫</h1>
        <button id="btn-export-md" class="btn-export">匯出 Markdown</button>
    </header>

    <main class="main-layout">
        <!-- 左欄：輸入表單 -->
        <aside class="left-panel">
            <section class="card">
                <form id="review-form">
                    <div class="form-group">
                        <div class="label-row"><label>題型 (Part)</label></div>
                        <div class="btn-group" id="part-selector">
                            <button type="button" class="btn-select" data-val="Part 1">Part 1</button>
                            <button type="button" class="btn-select" data-val="Part 2">Part 2</button>
                            <button type="button" class="btn-select active" data-val="Part 3">Part 3</button>
                            <button type="button" class="btn-select" data-val="Part 4">Part 4</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="label-row"><label>錯誤類型 (3秒判定)</label></div>
                        <div class="btn-group" id="type-selector">
                            <button type="button" class="btn-select active" data-val="A">A 聲音盲點</button>
                            <button type="button" class="btn-select" data-val="B">B 轉譯延遲</button>
                            <button type="button" class="btn-select" data-val="C">C 節奏失誤</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label for="context-input">題號 / 情境</label>
                            <span class="char-counter" id="context-count">0/100</span>
                        </div>
                        <input type="text" id="context-input" maxlength="100" placeholder="例：Q32-34 辦公室設備故障" required autocomplete="off">
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label for="obstacle-input">聽力阻礙點 (原音 / 混淆處)</label>
                            <span class="char-counter" id="obstacle-count">0/300</span>
                        </div>
                        <input type="text" id="obstacle-input" maxlength="300" placeholder="例：copier's jammed (連音弱讀沒聽出)" required autocomplete="off">
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label for="fix-input">正確替換 / 盲點修正</label>
                            <span class="char-counter" id="fix-count">0/300</span>
                        </div>
                        <input type="text" id="fix-input" maxlength="300" placeholder="例：malfunction (影印機故障)" required autocomplete="off">
                    </div>

                    <button type="submit" class="btn-submit">一鍵儲存記錄</button>
                </form>
            </section>
        </aside>

        <!-- 右欄：篩選與列表檢討區 -->
        <section class="right-panel">
            <div class="filter-section">
                <!-- 日期範圍篩選 -->
                <div class="date-range-container">
                    <div class="date-inputs">
                        <div class="date-field">
                            <span>起始日期 (台灣時間)</span>
                            <input type="date" id="start-date-filter">
                        </div>
                        <div class="date-field">
                            <span>結束日期 (台灣時間)</span>
                            <input type="date" id="end-date-filter">
                        </div>
                    </div>
                    <div class="date-actions">
                        <button type="button" id="btn-clear-date" class="btn-clear-date">清除日期範圍</button>
                    </div>
                </div>

                <!-- 快速分類標籤列 -->
                <div class="filter-tags-bar">
                    <button class="filter-tag active" data-filter="ALL">全部顯示</button>
                    <button class="filter-tag" data-filter="A">A 聲音盲點</button>
                    <button class="filter-tag" data-filter="B">B 轉譯延遲</button>
                    <button class="filter-tag" data-filter="C">C 節奏失誤</button>
                    <button class="filter-tag" data-filter="Part 3">Part 3</button>
                    <button class="filter-tag" data-filter="Part 4">Part 4</button>
                </div>
            </div>

            <div id="logs-container">
                <div class="empty-hint">讀取中...</div>
            </div>
        </section>
    </main>
</div>

<script>
    const API_BASE = window.location.origin.includes('http') ? '' : 'http://127.0.0.1:8000';

    let selectedPart = 'Part 3';
    let selectedType = 'A';
    let currentFilterTag = 'ALL';
    let startDateFilter = '';
    let endDateFilter = '';
    let logs = [];

    const form = document.getElementById('review-form');
    const logsContainer = document.getElementById('logs-container');
    const partButtons = document.querySelectorAll('#part-selector .btn-select');
    const typeButtons = document.querySelectorAll('#type-selector .btn-select');
    const filterTags = document.querySelectorAll('.filter-tag');
    const startDateInput = document.getElementById('start-date-filter');
    const endDateInput = document.getElementById('end-date-filter');
    const btnClearDate = document.getElementById('btn-clear-date');
    const btnExportMd = document.getElementById('btn-export-md');

    // 動態字數計數器綁定
    const contextInput = document.getElementById('context-input');
    const obstacleInput = document.getElementById('obstacle-input');
    const fixInput = document.getElementById('fix-input');

    const contextCount = document.getElementById('context-count');
    const obstacleCount = document.getElementById('obstacle-count');
    const fixCount = document.getElementById('fix-count');

    contextInput.addEventListener('input', () => {
        contextCount.textContent = `${contextInput.value.length}/100`;
    });
    obstacleInput.addEventListener('input', () => {
        obstacleCount.textContent = `${obstacleInput.value.length}/300`;
    });
    fixInput.addEventListener('input', () => {
        fixCount.textContent = `${fixInput.value.length}/300`;
    });

    partButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            partButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedPart = btn.dataset.val;
        });
    });

    typeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            typeButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedType = btn.dataset.val;
        });
    });

    filterTags.forEach(btn => {
        btn.addEventListener('click', () => {
            filterTags.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilterTag = btn.dataset.filter;
            renderLogs();
        });
    });

    startDateInput.addEventListener('change', (e) => {
        startDateFilter = e.target.value;
        renderLogs();
    });

    endDateInput.addEventListener('change', (e) => {
        endDateFilter = e.target.value;
        renderLogs();
    });

    btnClearDate.addEventListener('click', () => {
        startDateInput.value = '';
        endDateInput.value = '';
        startDateFilter = '';
        endDateFilter = '';
        renderLogs();
    });

    async function fetchLogs() {
        try {
            const res = await fetch(`${API_BASE}/api/logs`);
            if (!res.ok) throw new Error();
            logs = await res.json();
            renderLogs();
        } catch (err) {
            logsContainer.innerHTML = '<div class="empty-hint">無法連線至伺服器</div>';
        }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
            part: selectedPart,
            error_type: selectedType,
            context_info: contextInput.value.trim(),
            obstacle_point: obstacleInput.value.trim(),
            correction_fix: fixInput.value.trim()
        };

        try {
            const res = await fetch(`${API_BASE}/api/logs`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                const errorData = await res.json().catch(() => null);
                let message = '儲存失敗';
                if (errorData && errorData.detail) {
                    if (Array.isArray(errorData.detail)) {
                        message += '：' + errorData.detail.map(d => d.msg).join('; ');
                    } else {
                        message += '：' + errorData.detail;
                    }
                }
                alert(message);
                return;
            }

            const savedItem = await res.json();
            logs.unshift(savedItem);

            contextInput.value = '';
            obstacleInput.value = '';
            fixInput.value = '';
            contextCount.textContent = '0/100';
            obstacleCount.textContent = '0/300';
            fixCount.textContent = '0/300';
            renderLogs();
        } catch (err) {
            alert('連線失敗，請確認後端伺服器是否正常運行。');
        }
    });

    async function deleteLog(id) {
        try {
            const res = await fetch(`${API_BASE}/api/logs/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error();
            logs = logs.filter(item => item.id !== id);
            renderLogs();
        } catch (err) {
            alert('刪除失敗。');
        }
    }

    // 展開 / 收合控制函數
    window.toggleTextClamp = function(element) {
        const textTarget = element.classList.contains('log-title') 
            ? element 
            : element.querySelector('.box-text');
        const hintTarget = element.querySelector('.expand-hint');

        if (!textTarget) return;

        if (textTarget.classList.contains('clamped')) {
            textTarget.classList.remove('clamped');
            if (hintTarget) hintTarget.textContent = '點選收合 ▲';
        } else {
            textTarget.classList.add('clamped');
            if (hintTarget) hintTarget.textContent = '點選展開 ▼';
        }
    };

    function getFilteredLogs() {
        return logs.filter(item => {
            let matchesTag = true;
            if (currentFilterTag === 'A' || currentFilterTag === 'B' || currentFilterTag === 'C') {
                matchesTag = (item.error_type === currentFilterTag);
            } else if (currentFilterTag.startsWith('Part')) {
                matchesTag = (item.part === currentFilterTag);
            }

            let matchesDate = true;
            const itemDate = item.created_at ? item.created_at.substring(0, 10) : '';

            if (startDateFilter && itemDate < startDateFilter) {
                matchesDate = false;
            }
            if (endDateFilter && itemDate > endDateFilter) {
                matchesDate = false;
            }

            return matchesTag && matchesDate;
        });
    }

    function renderLogs() {
        const filtered = getFilteredLogs();

        if (filtered.length === 0) {
            logsContainer.innerHTML = '<div class="empty-hint">暫無符合區間或條件的記錄</div>';
            return;
        }

        logsContainer.innerHTML = filtered.map(item => {
            const badgeClass = item.error_type === 'A' ? 'badge-a' : (item.error_type === 'B' ? 'badge-b' : 'badge-c');
            const typeLabel = item.error_type === 'A' ? '聲音盲點' : (item.error_type === 'B' ? '轉譯延遲' : '節奏失誤');

            return `
                <article class="log-item">
                    <div class="log-topbar">
                        <div class="log-badges">
                            <span class="badge badge-part">${item.part}</span>
                            <span class="badge ${badgeClass}">${item.error_type} ${typeLabel}</span>
                        </div>
                        <div class="log-meta">
                            <span class="time-label">${item.created_at}</span>
                            <button class="btn-del" onclick="event.stopPropagation(); deleteLog(${item.id})">刪除</button>
                        </div>
                    </div>

                    <div class="log-title clamped" onclick="toggleTextClamp(this)">
                        ${item.context_info}
                    </div>

                    <div class="log-content">
                        <div class="content-box" onclick="toggleTextClamp(this)">
                            <strong>聽力阻礙點</strong>
                            <div class="box-text clamped">${item.obstacle_point}</div>
                            <span class="expand-hint">點選展開 ▼</span>
                        </div>
                        <div class="content-box" onclick="toggleTextClamp(this)">
                            <strong>正確替換 / 盲點修正</strong>
                            <div class="box-text clamped">${item.correction_fix}</div>
                            <span class="expand-hint">點選展開 ▼</span>
                        </div>
                    </div>
                </article>
            `;
        }).join('');
    }

    btnExportMd.addEventListener('click', () => {
        const targetLogs = getFilteredLogs();
        if (targetLogs.length === 0) {
            alert('目前無可匯出的記錄。');
            return;
        }

        const now = new Date();
        const exportTimeStr = now.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false });
        
        let rangeDesc = '全部區間';
        if (startDateFilter && endDateFilter) {
            rangeDesc = `${startDateFilter} 至 ${endDateFilter}`;
        } else if (startDateFilter) {
            rangeDesc = `${startDateFilter} 起`;
        } else if (endDateFilter) {
            rangeDesc = `至 ${endDateFilter} 止`;
        }

        let md = `# 多益聽力錯題檢討紀錄\n\n`;
        md += `- 匯出時間：${exportTimeStr} (UTC+8)\n`;
        md += `- 篩選日期區間：${rangeDesc}\n`;
        md += `- 總筆數：共 ${targetLogs.length} 筆\n\n`;
        md += `| 建立時間 | 題型 | 錯誤類型 | 題號/情境 | 聽力阻礙點 | 正確替換 / 盲點修正 |\n`;
        md += `| :--- | :--- | :--- | :--- | :--- | :--- |\n`;

        targetLogs.forEach(item => {
            const typeLabel = item.error_type === 'A' ? 'A 聲音盲點' : (item.error_type === 'B' ? 'B 轉譯延遲' : 'C 節奏失誤');
            const cleanContext = item.context_info.replace(/\|/g, '\\|');
            const cleanObstacle = item.obstacle_point.replace(/\|/g, '\\|');
            const cleanFix = item.correction_fix.replace(/\|/g, '\\|');
            md += `| ${item.created_at || '-'} | ${item.part} | ${typeLabel} | ${cleanContext} | ${cleanObstacle} | ${cleanFix} |\n`;
        });

        const blob = new Blob([md], { type: 'text/markdown;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const fileDate = exportTimeStr.split(' ')[0].replace(/\//g, '-');
        a.href = url;
        a.download = `toeic_review_${fileDate}.md`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });

    fetchLogs();
</script>
</body>
</html>
